<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chá de Panela - Luiza e André</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>

/* ===== CONFIG GERAL ===== */
body{
  margin:0;
  font-family:'Playfair Display', serif;
  background:#0f0f0f;
  color:#fff;
  text-align:center;
}

/* ===== PRÉ CAPA ===== */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#111,#1a1a1a);
}

.hero h2{
  font-size:28px;
  color:#d4af37;
  margin:0;
  letter-spacing:2px;
}

.hero h1{
  font-size:48px;
  color:#d4af37;
  margin:10px 0 0 0;
  font-weight:600;
  letter-spacing:3px;
}

/* ===== SEÇÃO DE LISTA ===== */
.section{
  padding:60px 20px;
}

.section h2{
  font-size:32px;
  margin-bottom:40px;
  color:#d4af37;
}

.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:30px;
}

/* ===== CARDS ===== */
.card{
  position:relative;
  width:260px;
  padding:20px;
  border-radius:22px;
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(10px);
  transition:transform .3s ease, box-shadow .3s ease;
  overflow:hidden;
}

/* borda base */
.card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:22px;
  border:1px solid rgba(212,175,55,.3);
  pointer-events:none;
}

/* 🔥 Neon só no hover */
.card:hover::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:24px;
  padding:2px;

  background:conic-gradient(
    from 0deg,
    rgba(212,175,55,0) 0deg,
    rgba(248,231,176,1) 90deg,
    rgba(212,175,55,1) 180deg,
    rgba(248,231,176,1) 270deg,
    rgba(212,175,55,0) 360deg
  );

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;

  filter:
    drop-shadow(0 0 8px rgba(212,175,55,1))
    drop-shadow(0 0 18px rgba(212,175,55,.8))
    drop-shadow(0 0 30px rgba(248,231,176,.7));

  animation:spinBorder 4s linear infinite;
  pointer-events:none;
}

@keyframes spinBorder{
  to{ transform:rotate(360deg); }
}

.card:hover{
  transform:translateY(-8px) scale(1.03);
  box-shadow:0 25px 50px rgba(0,0,0,.5);
}

.card h3{
  color:#d4af37;
  margin-bottom:10px;
}

.card p{
  font-size:14px;
  opacity:.85;
}

button{
  margin-top:15px;
  padding:8px 18px;
  border:none;
  border-radius:20px;
  background:#d4af37;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#f8e7b0;
}

</style>
</head>

<body>

<!-- PRÉ CAPA -->
<section class="hero">
  <h2>Chá de Panela</h2>
  <h1>Luiza e André</h1>
</section>

<!-- LISTA -->
<section class="section">
  <h2>Lista de Presentes</h2>

  <div class="cards">

    <div class="card">
      <h3>Jogo de Panelas</h3>
      <p>Conjunto completo antiaderente.</p>
      <button>Presentear</button>
    </div>

    <div class="card">
      <h3>Liquidificador</h3>
      <p>Potência 1200W inox.</p>
      <button>Presentear</button>
    </div>

    <div class="card">
      <h3>Jogo de Taças</h3>
      <p>Conjunto para vinho e água.</p>
      <button>Presentear</button>
    </div>

  </div>
</section>

</body>
</html>
