<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chá de Panela - Luiza & André</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js" defer></script>

<script>
window.addEventListener('DOMContentLoaded', function () {
  try { emailjs.init("3zU5_d_KcUdDLjXQY"); } catch(e){ console.error(e); }

  // Partículas douradas bem leves no fundo (bolinhas subindo)
  try {
    if (window.tsParticles) {
      tsParticles.load("tsparticles", {
        fpsLimit: 60,
        fullScreen: { enable: false },
        background: { color: "transparent" },
        particles: {
          number: { value: 28, density: { enable: true, area: 900 } },
          color: { value: ["#d4af37", "#f8e7b0", "#ffffff"] },
          opacity: { value: 0.18, random: { enable: true, minimumValue: 0.06 } },
          size: { value: { min: 1, max: 4 }, random: true },
          move: {
            enable: true,
            speed: 0.7,
            direction: "top",
            outModes: { default: "out" }
          },
          shape: { type: "circle" }
        },
        detectRetina: true
      });
    }
  } catch (e) { console.error(e); }
});
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html, body{height:100%}

/* Fundo: garante que no mobile NÃO “corta” na segunda página */
body{
  font-family:'Poppins',sans-serif;
  color:white;
  text-align:center;
  overflow-x:hidden;
  min-height:100svh; /* melhor que 100vh no mobile */
  background:
    linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.25)),
    url('arte_casamento.jpeg');
  background-position:center top;
  background-repeat:no-repeat;
  background-size:cover;
  background-attachment:fixed;
}

/* iOS/Android: fixed pode dar bug/corte — troca para scroll */
@media(max-width:768px){
  body{
    background-attachment:scroll;
    background-position:center top;
    background-size:cover;
    min-height:100svh;
  }
}

#tsparticles{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}

.precover{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.65);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
  padding:20px;
}

.circle-photo{
  width:180px;
  height:180px;
  border-radius:50%;
  overflow:hidden;
  border:5px solid #d4af37;
  margin-bottom:20px;
  box-shadow:0 0 15px rgba(212,175,55,0.6);
}
.circle-photo img{width:100%;height:100%;object-fit:cover}

h1{
  font-family:'Great Vibes',cursive;
  font-size:clamp(38px, 7vw, 64px);
  margin-top:20px;
  line-height:1.1;
  max-width:95vw;
  padding:0 8px;
  overflow-wrap:anywhere;
  background:linear-gradient(45deg,#fff,#f8e7b0,#d4af37,#fff);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s infinite linear;
}

@keyframes shine{
  0%{background-position:0%}
  100%{background-position:300%}
}

.date, .countdown, .location{margin:8px 0;font-size:20px}

.maps-btn, .back-btn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:transform .18s ease, filter .18s ease;
}
.maps-btn:hover, .back-btn:hover{transform:translateY(-1px);filter:brightness(1.05)}

.overlay{
  background:rgba(0,0,0,0.65);
  min-height:100svh; /* evita corte no mobile ao rolar */
  padding:20px 20px 60px;
  position:relative;
  z-index:2;
  display:none;
}

.container{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:40px;
  gap:20px;
}

.card{
  position:relative;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:15px;
  width:260px;
  border:1px solid rgba(212,175,55,0.18);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  overflow:hidden;
}

/* Hover lift */
.card:hover{
  transform:translateY(-6px) scale(1.01);
  box-shadow:0 18px 40px rgba(0,0,0,0.35);
  border-color:rgba(212,175,55,0.45);
}

/* Animação dourada contornando (sempre ligada, mais forte no hover) */
.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:22px;
  padding:2px;
  background:conic-gradient(
    from 0deg,
    rgba(212,175,55,0) 0deg,
    rgba(212,175,55,.85) 60deg,
    rgba(248,231,176,.55) 120deg,
    rgba(212,175,55,.85) 180deg,
    rgba(255,255,255,.25) 240deg,
    rgba(212,175,55,0) 360deg
  );
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:.55;
  filter:blur(.25px);
  animation:borderSpin 3.6s linear infinite;
  pointer-events:none;
}

.card:hover::before{opacity:.9;filter:blur(0px)}

@keyframes borderSpin{
  to{transform:rotate(360deg)}
}

.card img{width:100%;border-radius:15px}

button{
  margin-top:10px;
  padding:8px 15px;
  border:none;
  border-radius:20px;
  background:#d4af37;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:transform .18s ease, filter .18s ease;
}
button:hover{transform:translateY(-1px);filter:brightness(1.05)}
button:disabled{background:gray;cursor:not-allowed;filter:none;transform:none}

input{
  margin-top:8px;
  padding:8px;
  width:90%;
  border-radius:15px;
  border:none;
  text-align:center;
}

.badge{
  margin-top:10px;
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  background:rgba(212,175,55,0.18);
  border:1px solid rgba(212,175,55,0.25);
}
.badge.reservado{
  background:rgba(255,255,255,0.10);
  border-color:rgba(255,255,255,0.22);
}
</style>
</head>

<body>

<div id="tsparticles"></div>

<!-- PRÉ CAPA -->
<div class="precover" id="precover">
  <div class="circle-photo">
    <img src="nos.jpeg" alt="Foto">
  </div>
  <h1>Luiza & André</h1>
  <div class="date">20/06/2026 - 18:00 horas</div>
  <div class="countdown" id="countdown-pre"></div>
  <div class="location">Rua Vera Lucia, 215 - Sinimbu</div>
  <button class="maps-btn" onclick="abrirMapa()">Ver no Maps</button>
  <button class="maps-btn" onclick="tocarMusica()">🎵 Tocar Música</button>
  <button class="maps-btn" onclick="entrarEvento()">Entrar no Evento</button>
</div>

<audio id="bgMusic" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- CONTEÚDO -->
<div class="overlay" id="mainContent">

  <h1>Luiza & André</h1>
  <div class="date">20/06/2026 - 18:00 horas</div>
  <div class="countdown" id="countdown-main"></div>
  <div class="location">Rua Vera Lucia, 215 - Sinimbu</div>
  <button class="maps-btn" onclick="abrirMapa()">Ver no Maps</button>
  <button class="back-btn" onclick="voltarPreCapa()">🔙 Voltar</button>

  <div class="container">

    <div class="card" id="Geladeira" data-item="Geladeira">
      <img src="Imagens/geladeira.jpg" alt="Geladeira">
      <h3>Geladeira</h3>
      <div class="badge" id="badge-Geladeira">Disponível</div>
      <input type="text" placeholder="Seu nome" id="nome-Geladeira">
      <input type="email" placeholder="Seu e-mail" id="email-Geladeira">
      <button id="btn-Geladeira" onclick="Presentear('Geladeira')">Presentear</button>
    </div>

    <div class="card" id="Cooktop" data-item="Cooktop">
      <img src="Imagens/cooktop.png" alt="Cooktop">
      <h3>Cooktop</h3>
      <div class="badge" id="badge-Cooktop">Disponível</div>
      <input type="text" placeholder="Seu nome" id="nome-Cooktop">
      <input type="email" placeholder="Seu e-mail" id="email-Cooktop">
      <button id="btn-Cooktop" onclick="Presentear('Cooktop')">Presentear</button>
    </div>

  </div>
</div>

<script>
// Contagem regressiva
const countDownDate = new Date("Jun 20, 2026 18:00:00").getTime();
setInterval(() => {
  const now = new Date().getTime();
  const distance = countDownDate - now;

  const days = Math.max(0, Math.floor(distance / (1000*60*60*24)));
  const hours = Math.max(0, Math.floor((distance % (1000*60*60*24))/(1000*60*60)));
  const minutes = Math.max(0, Math.floor((distance % (1000*60*60))/(1000*60)));
  const seconds = Math.max(0, Math.floor((distance % (1000*60))/1000));

  const txt = `${days} dias ${hours}h ${minutes}m ${seconds}s`;
  document.getElementById("countdown-pre").textContent = txt;
  document.getElementById("countdown-main").textContent = txt;
}, 1000);

function abrirMapa(){
  const q = encodeURIComponent("Rua Vera Lucia, 215 - Sinimbu");
  window.open(`https://www.google.com/maps/search/?api=1&query=${q}`,"_blank");
}

const audio = document.getElementById("bgMusic");

function tocarMusica(){
  if(audio.paused){
    audio.volume = 0.3;
    audio.play().catch(console.error);
  } else {
    audio.pause();
  }
}

function entrarEvento(){
  document.getElementById("precover").style.display="none";
  document.getElementById("mainContent").style.display="block";
  window.scrollTo({ top: 0, behavior: "instant" });
}

function voltarPreCapa(){
  document.getElementById("mainContent").style.display="none";
  document.getElementById("precover").style.display="flex";
  window.scrollTo({ top: 0, behavior: "instant" });
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBv1JPd9CIzGsdEAEozbns7O87ct11dbIw",
  authDomain: "casamento-luiza-andre.firebaseapp.com",
  projectId: "casamento-luiza-andre",
  storageBucket: "casamento-luiza-andre.firebasestorage.app",
  messagingSenderId: "79078651574",
  appId: "1:79078651574:web:71d4b92e7ed41de2c49817"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

function setReservadoUI(item, data) {
  const btn = document.getElementById("btn-" + item);
  const badge = document.getElementById("badge-" + item);
  const inNome = document.getElementById("nome-" + item);
  const inEmail = document.getElementById("email-" + item);

  const reservado = !!(data && data.reservado);

  if (badge) {
    badge.textContent = reservado ? "Reservado" : "Disponível";
    badge.classList.toggle("reservado", reservado);
  }
  if (btn) {
    btn.disabled = reservado;
    btn.textContent = reservado ? "Já reservado" : "Presentear";
  }
  if (inNome) inNome.disabled = reservado;
  if (inEmail) inEmail.disabled = reservado;
}

document.querySelectorAll(".card[data-item]").forEach((card) => {
  const item = card.getAttribute("data-item");
  const ref = doc(db, "reservas", item);

  onSnapshot(ref, (snap) => {
    setReservadoUI(item, snap.exists() ? snap.data() : null);
  }, (err) => console.error("onSnapshot erro:", err));
});

async function Presentear(item){
  const nome = document.getElementById("nome-"+item)?.value.trim();
  const email = document.getElementById("email-"+item)?.value.trim();
  if(!nome || !email){ alert("Preencha nome e e-mail"); return; }

  const ref = doc(db,"reservas",item);

  try{
    const btn = document.getElementById("btn-" + item);
    if (btn) { btn.disabled = true; btn.textContent = "Reservando..."; }

    await runTransaction(db, async (transaction)=>{
      const snap = await transaction.get(ref);
      if(snap.exists() && snap.data().reservado){
        throw new Error("ja_reservado");
      }
      transaction.set(ref,{reservado:true,nome,email,ts:serverTimestamp()});
    });

    try{
      if (window.emailjs?.send) {
        await emailjs.send("service_7b5jpat","template_kl4avko",{
          nome,email,item,
          mensagem:"Obrigado por participar deste momento!"
        });
      }
    } catch (e) {
      console.warn("Falha ao enviar e-mail (EmailJS):", e);
    }

    alert("Reserva realizada com sucesso!");
  }catch(e){
    if (String(e?.message || e) === "ja_reservado") {
      alert("Este item já foi reservado.");
    } else {
      console.error(e);
      alert("Erro ao reservar. Tente novamente.");
    }
  }
}

window.Presentear = Presentear;
</script>

</body>
</html>
