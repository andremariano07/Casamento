<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chá de Panela - Luiza & André</title>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js" defer></script>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      try { emailjs.init("3zU5_d_KcUdDLjXQY"); } catch(e){ console.error('Falha ao inicializar EmailJS', e); }
    });
  </script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Poppins',sans-serif;
      color:white;
      text-align:center;
      overflow-x:hidden;
      background:url('arte_casamento.jpeg') no-repeat center center/cover fixed;
      background-color: #1a1a1a;
    }

    .overlay{
      background:rgba(0,0,0,0.75);
      min-height:100vh;
      width: 100%;
      position:relative;
      z-index:2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    #tsparticles { position:fixed; width:100%; height:100%; z-index:1; pointer-events: none; }

    /* --- NAVEGAÇÃO ENTRE PÁGINAS --- */
    #intro-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; animation: fadeIn 1.5s ease; }
    #lista-presentes { display: none; width: 100%; animation: fadeIn 1s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* --- ESTILOS DA CAPA --- */
    .foto-casal {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 4px solid #d4af37;
      object-fit: cover;
      margin-bottom: 20px;
      box-shadow: 0 0 25px rgba(212,175,55,0.4);
    }

    h1 {
      font-family:'Great Vibes',cursive;
      font-size: 60px;
      margin-bottom: 10px;
      background: linear-gradient(45deg,#fff,#f8e7b0,#d4af37,#fff);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s infinite linear;
    }

    @keyframes shine { 0%{background-position:0%} 100%{background-position:300%} }

    .countdown-box {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      padding: 20px;
      border-radius: 15px;
      margin: 20px 0;
      border: 1px solid rgba(212,175,55,0.3);
      min-width: 280px;
    }

    #countdown { font-size: 22px; font-weight: 600; color: #d4af37; letter-spacing: 1px; }

    .info-local { font-size: 18px; line-height: 1.6; margin-bottom: 30px; }

    /* --- BOTÕES --- */
    .btn-gold {
      padding: 15px 35px;
      font-size: 16px;
      border: none;
      border-radius: 50px;
      background: #d4af37;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin: 10px;
    }
    .btn-gold:hover { background: #fff; transform: scale(1.05); }
    .btn-outline {
      background: transparent;
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 10px 25px;
      border-radius: 50px;
      cursor: pointer;
    }

    /* --- LISTA DE PRESENTES --- */
    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 15px;
      width: 260px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.4s;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      border: 1px solid rgba(212,175,55,0.5);
    }

    .card h3 { margin: 15px 0 10px; font-size: 20px; color: #f8e7b0; }

    input {
      width: 90%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: none;
      text-align: center;
    }

    .btn-presentear {
      width: 90%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #d4af37;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-presentear:disabled { background: #666; cursor: not-allowed; }

    @media(max-width: 600px) {
      h1 { font-size: 45px; }
      .card { width: 100%; }
    }
  </style>
</head>

<body>

  <div id="tsparticles"></div>

  <div class="overlay">

    <section id="intro-page">
      <img src="sua-foto.jpg" alt="Luiza e André" class="foto-casal">
      <h1>Luiza & André</h1>
      
      <div class="info-local">
        <p><strong>20 de Junho de 2026</strong></p>
        <p>Rua Vera Lucia, 215 - Sinimbu</p>
      </div>

      <div class="countdown-box">
        <p style="font-size: 14px; text-transform: uppercase; margin-bottom: 5px;">Contagem Regressiva</p>
        <div id="countdown"></div>
      </div>

      <button class="btn-gold" onclick="abrirPresentes()">Ver Lista de Presentes</button>
      
      <div style="margin-top: 15px;">
        <button class="btn-outline" onclick="abrirMapa()">📍 Ver Localização</button>
        <button class="btn-outline" onclick="tocarMusica()" id="music-btn">🎵 Tocar Música</button>
      </div>

      <audio id="bgMusic" loop>
        <source src="https://voca.ro/1c3ZGc93IyZe" type="audio/mpeg">
      </audio>
    </section>

    <section id="lista-presentes">
      <h1 style="font-size: 40px;">Lista de Presentes</h1>
      <p style="margin-bottom: 20px;">Clique no item que deseja reservar</p>

      <div class="container">
        <div class="card" id="Geladeira">
          <img src="Imagens/geladeira.jpg" alt="Geladeira">
          <h3>Geladeira</h3>
          <input type="text" placeholder="Seu nome" id="nome-Geladeira">
          <input type="email" placeholder="Seu e-mail" id="email-Geladeira">
          <button class="btn-presentear" onclick="Presentear('Geladeira')">Presentear</button>
        </div>

        <div class="card" id="Jogo de Panela">
          <img src="Imagens/Jogo de Panela.jpg" alt="Jogo de Panela">
          <h3>Jogo de Panela</h3>
          <input type="text" placeholder="Seu nome" id="nome-Jogo de Panela">
          <input type="email" placeholder="Seu e-mail" id="email-Jogo de Panela">
          <button class="btn-presentear" onclick="Presentear('Jogo de Panela')">Presentear</button>
        </div>

        <div class="card" id="Microondas">
          <img src="Imagens/microondas.jpg" alt="Microondas">
          <h3>Microondas</h3>
          <input type="text" placeholder="Seu nome" id="nome-Microondas">
          <input type="email" placeholder="Seu e-mail" id="email-Microondas">
          <button class="btn-presentear" onclick="Presentear('Microondas')">Presentear</button>
        </div>

        <div class="card" id="Cooktop">
          <img src="Imagens/cooktop.png" alt="Cooktop">
          <h3>Cooktop</h3>
          <input type="text" placeholder="Seu nome" id="nome-Cooktop">
          <input type="email" placeholder="Seu e-mail" id="email-Cooktop">
          <button class="btn-presentear" onclick="Presentear('Cooktop')">Presentear</button>
        </div>
      </div>

      <button class="btn-outline" style="margin-top: 40px; color: white; border-color: white;" onclick="voltarIntro()">← Voltar</button>
    </section>

  </div>

  <script>
    // Navegação simples
    function abrirPresentes() {
      document.getElementById('intro-page').style.display = 'none';
      document.getElementById('lista-presentes').style.display = 'block';
      window.scrollTo(0,0);
    }

    function voltarIntro() {
      document.getElementById('lista-presentes').style.display = 'none';
      document.getElementById('intro-page').style.display = 'flex';
    }

    // Partículas
    window.addEventListener('DOMContentLoaded', function(){
      if (window.tsParticles) {
        tsParticles.load("tsparticles", {
          particles:{
            number:{value:40},
            color:{value:"#d4af37"},
            shape:{type:"circle"},
            opacity:{value:0.5},
            size:{value:3},
            move:{enable:true,speed:0.8}
          }
        });
      }
    });

    // Contagem regressiva
    var countDownDate = new Date("Jun 20, 2026 18:00:00").getTime();
    setInterval(function() {
      var now = new Date().getTime();
      var distance = countDownDate - now;
      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);
      document.getElementById("countdown").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
    }, 1000);

    // Maps
    function abrirMapa(){
      const q = encodeURIComponent("Rua Vera Lucia, 215 - Sinimbu");
      window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, "_blank");
    }

    // Música
    const audio = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("music-btn");
    audio.volume = 0.3;

    function tocarMusica() {
      if (audio.paused) {
        audio.play();
        musicBtn.innerText = "🔇 Pausar Música";
      } else {
        audio.pause();
        musicBtn.innerText = "🎵 Tocar Música";
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBv1JPd9CIzGsdEAEozbns7O87ct11dbIw",
      authDomain: "casamento-luiza-andre.firebaseapp.com",
      projectId: "casamento-luiza-andre",
      storageBucket: "casamento-luiza-andre.firebasestorage.app",
      messagingSenderId: "79078651574",
      appId: "1:79078651574:web:71d4b92e7ed41de2c49817"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ITENS = ["Geladeira", "Cooktop", "Jogo de Panela", "Microondas"];

    function aplicarReservado(item){
      const card = document.getElementById(item);
      if (!card) return;
      const botao = card.querySelector("button");
      card.querySelectorAll("input").forEach(i => i.style.display = "none");
      if (botao){
        botao.disabled = true;
        botao.innerText = "Já Reservado";
        botao.style.background = "#666";
      }
    }

    function aplicarDisponivel(item){
      const card = document.getElementById(item);
      if (!card) return;
      const botao = card.querySelector("button");
      card.querySelectorAll("input").forEach(i => i.style.display = "block");
      if (botao){
        botao.disabled = false;
        botao.innerText = "Presentear";
        botao.style.background = "#d4af37";
      }
    }

    ITENS.forEach(item => {
      onSnapshot(doc(db, "reservas", item), (snap) => {
        if (snap.exists() && snap.data().reservado) aplicarReservado(item);
        else aplicarDisponivel(item);
      });
    });

    window.Presentear = async function(item){
      const nome = document.getElementById("nome-"+item).value.trim();
      const email = document.getElementById("email-"+item).value.trim();

      if (!nome || !email) { alert("Por favor, preencha nome e e-mail."); return; }

      try {
        await runTransaction(db, async (transaction) => {
          const ref = doc(db, "reservas", item);
          const snap = await transaction.get(ref);
          if (snap.exists() && snap.data().reservado) throw "Item já reservado!";
          transaction.set(ref, { reservado: true, nome, email, ts: serverTimestamp() });
        });

        await emailjs.send("service_7b5jpat","template_kl4avko",{nome, email, item});
        alert("Obrigado! Item reservado com sucesso. ✨");
      } catch (e) {
        alert(e);
      }
    };
  </script>

</body>
</html>
