<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chá de Panela - Luiza & André</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js" defer></script>

<script>
window.addEventListener('DOMContentLoaded', function () {
  try { emailjs.init("3zU5_d_KcUdDLjXQY"); } catch(e){ console.error(e); }
});
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html, body{
  height:100%;
}

body{
  font-family:'Poppins',sans-serif;
  color:white;
  text-align:center;
  overflow-x:hidden;
  min-height:100vh;
  background:url('arte_casamento.jpeg') center center/cover no-repeat fixed;
}

/* FUNDO BOLINHAS DOURADAS */
#particles-js{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  z-index:0;
}

/* Ajuste mobile */
@media(max-width:768px){
  body{
    background-attachment:scroll;
    background-position:top center;
  }
}

/* PRÉ CAPA */
.precover{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.65);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
  padding:30px 20px;
  text-align:center;
}

.circle-photo{
  width:180px;
  height:180px;
  border-radius:50%;
  overflow:hidden;
  border:4px solid #d4af37;
  margin-bottom:20px;
  box-shadow:0 0 20px rgba(212,175,55,0.6);
}

.circle-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:clamp(38px, 8vw, 65px);
  line-height:1.2;
  margin:15px 0;
  word-break:break-word;
  padding:0 10px;
  background:linear-gradient(45deg,#fff,#f8e7b0,#d4af37,#fff);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s infinite linear;
}

@keyframes shine{
  0%{background-position:0%}
  100%{background-position:300%}
}

.date, #countdown, .location{
  margin:6px 0;
  font-size:18px;
}

.maps-btn, .back-btn{
  margin-top:12px;
  padding:10px 22px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.maps-btn:hover, .back-btn:hover{
  background:#fff;
}

.overlay{
  background:rgba(0,0,0,0.65);
  min-height:100vh;
  padding:40px 20px;
  position:relative;
  z-index:5;
  display:none;
}

.container{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:40px;
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:15px;
  width:260px;
}

.card img{
  width:100%;
  border-radius:15px;
}

button{
  margin-top:10px;
  padding:8px 15px;
  border:none;
  border-radius:20px;
  background:#d4af37;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:gray;
}

input{
  margin-top:8px;
  padding:8px;
  width:90%;
  border-radius:15px;
  border:none;
  text-align:center;
}
</style>
</head>

<body>

<div id="particles-js"></div>

<!-- PRÉ CAPA -->
<div class="precover" id="precover">
  <div class="circle-photo">
    <img src="nos.jpeg" alt="Foto">
  </div>
  <h1>Luiza & André</h1>
  <div class="date">20/06/2026 - 18:00 horas</div>
  <div id="countdown"></div>
  <div class="location">Rua Vera Lucia, 215 - Sinimbu</div>
  <button class="maps-btn" onclick="abrirMapa()">Ver no Maps</button>
  <button class="maps-btn" onclick="tocarMusica()">🎵 Tocar Música</button>
  <button class="maps-btn" onclick="entrarEvento()">Entrar no Evento</button>
</div>

<audio id="bgMusic" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- CONTEÚDO -->
<div class="overlay" id="mainContent">

<h1>Luiza & André</h1>
<div class="date">20/06/2026 - 18:00 horas</div>
<div id="countdown"></div>
<div class="location">Rua Vera Lucia, 215 - Sinimbu</div>
<button class="maps-btn" onclick="abrirMapa()">Ver no Maps</button>
<button class="back-btn" onclick="voltarPreCapa()">🔙 Voltar</button>

<div class="container">

<div class="card" id="Geladeira">
<img src="Imagens/geladeira.jpg">
<h3>Geladeira</h3>
<input type="text" placeholder="Seu nome" id="nome-Geladeira">
<input type="email" placeholder="Seu e-mail" id="email-Geladeira">
<button onclick="Presentear('Geladeira')">Presentear</button>
</div>

<div class="card" id="Cooktop">
<img src="Imagens/cooktop.png">
<h3>Cooktop</h3>
<input type="text" placeholder="Seu nome" id="nome-Cooktop">
<input type="email" placeholder="Seu e-mail" id="email-Cooktop">
<button onclick="Presentear('Cooktop')">Presentear</button>
</div>

</div>
</div>

<script>
// Partículas douradas pequenas
tsParticles.load("particles-js", {
  particles: {
    number: { value: 60 },
    size: { value: 3 },
    color: { value: "#d4af37" },
    move: { enable: true, speed: 1 },
    opacity: { value: 0.6 },
  }
});

// Contagem regressiva
const countDownDate = new Date("Jun 20, 2026 18:00:00").getTime();
setInterval(() => {
  const now = new Date().getTime();
  const distance = countDownDate - now;
  const days = Math.floor(distance / (1000*60*60*24));
  const hours = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
  const minutes = Math.floor((distance % (1000*60*60))/(1000*60));
  const seconds = Math.floor((distance % (1000*60))/1000);
  document.querySelectorAll("#countdown").forEach(d => 
    d.innerHTML = `${days} dias ${hours}h ${minutes}m ${seconds}s`
  );
},1000);

function abrirMapa(){
  const q = encodeURIComponent("Rua Vera Lucia, 215 - Sinimbu");
  window.open(`https://www.google.com/maps/search/?api=1&query=${q}`,"_blank");
}

const audio = document.getElementById("bgMusic");

function tocarMusica(){
  if(audio.paused){
    audio.volume = 0.3;
    audio.play().catch(console.error);
  } else {
    audio.pause();
  }
}

function entrarEvento(){
  document.getElementById("precover").style.display="none";
  document.getElementById("mainContent").style.display="block";
}

function voltarPreCapa(){
  document.getElementById("mainContent").style.display="none";
  document.getElementById("precover").style.display="flex";
}
</script>

<!-- FIREBASE (mantido intacto) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBv1JPd9CIzGsdEAEozbns7O87ct11dbIw",
  authDomain: "casamento-luiza-andre.firebaseapp.com",
  projectId: "casamento-luiza-andre",
  storageBucket: "casamento-luiza-andre.firebasestorage.app",
  messagingSenderId: "79078651574",
  appId: "1:79078651574:web:71d4b92e7ed41de2c49817"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

async function Presentear(item){
  const nome = document.getElementById("nome-"+item).value.trim();
  const email = document.getElementById("email-"+item).value.trim();
  if(!nome || !email){ alert("Preencha nome e e-mail"); return; }

  const ref = doc(db,"reservas",item);
  try{
    await runTransaction(db, async (transaction)=>{
      const snap = await transaction.get(ref);
      if(snap.exists() && snap.data().reservado){
        throw "ja_reservado";
      }
      transaction.set(ref,{reservado:true,nome,email,ts:serverTimestamp()});
    });

    await emailjs.send("service_7b5jpat","template_kl4avko",{
      nome,email,item,
      mensagem:"Obrigado por participar deste momento!"
    });

    alert("Reserva realizada com sucesso!");
  }catch(e){
    alert("Item já reservado ou erro.");
  }
}
</script>

</body>
</html>
