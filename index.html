<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chá de Panela Luiza & André</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#fafafa;
text-align:center;
}

header{
background:linear-gradient(45deg,#d4af37,#f5e6a3);
padding:30px;
color:white;
animation:fade 1.5s ease;
}

h1{
font-family:'Playfair Display';
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:20px;
gap:20px;
}

.card{
background:white;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.15);
width:280px;
padding:15px;
transition:0.4s;
animation:fadeUp 1s ease;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
border-radius:10px;
}

input{
width:90%;
padding:8px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:8px;
background:#d4af37;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#b8962f;
}

.reservado{
color:red;
font-weight:bold;
margin-top:10px;
}

#contador{
font-size:22px;
margin-top:10px;
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(40px)}
to{opacity:1; transform:translateY(0)}
}
</style>
</head>

<body>

<header>
<h1>Luiza & André</h1>
<h3>Chá de Panela</h3>
<p>20/06/2026</p>
<div id="contador"></div>
</header>

<div class="container">

<!-- GELADEIRA -->
<div class="card">
<img src="https://images.tcdn.com.br/img/img_prod/1102878/geladeira_branca_375l_2159_1.jpg">
<h3>Geladeira</h3>

<input placeholder="Seu nome" id="nome-geladeira">
<button onclick="reservar('geladeira')">Reservar</button>
<div id="status-geladeira"></div>
</div>

<!-- FOGÃO -->
<div class="card">
<img src="https://images.tcdn.com.br/img/img_prod/1102878/fogao_branco_4_bocas_2165_1.jpg">
<h3>Fogão</h3>

<input placeholder="Seu nome" id="nome-fogao">
<button onclick="reservar('fogao')">Reservar</button>
<div id="status-fogao"></div>
</div>

</div>

<!-- EMAIL JS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("3zU5_d_KcUdDLjXQY");
</script>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBv1JPd9CIzGsdEAEozbns7O87ct11dbIw",
authDomain: "casamento-luiza-andre.firebaseapp.com",
projectId: "casamento-luiza-andre",
storageBucket: "casamento-luiza-andre.firebasestorage.app",
messagingSenderId: "79078651574",
appId: "1:79078651574:web:71d4b92e7ed41de2c49817"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.reservar = async function(item){

let nome = document.getElementById("nome-"+item).value;

if(!nome){
alert("Digite seu nome");
return;
}

const docRef = doc(db,"reservas",item);
const docSnap = await getDoc(docRef);

if(docSnap.exists()){
alert("Item já reservado");
return;
}

await setDoc(docRef,{nome:nome});

// EMAIL
emailjs.send("service_7b5jpat","template_kl4avko",{
item:item,
nome:nome
});

alert("Reserva realizada com sucesso!");
location.reload();
}

// Verificar reservas ao carregar
async function verificar(){

const itens = ["geladeira","fogao"];

for(let item of itens){

const status = document.getElementById("status-"+item);
const docRef = doc(db,"reservas",item);
const docSnap = await getDoc(docRef);

if(docSnap.exists()){
status.innerHTML = "<div class='reservado'>Item já reservado</div>";
}
}
}

verificar();

</script>

<!-- CONTADOR -->
<script>
const dataEvento = new Date("June 20, 2026 00:00:00");

setInterval(()=>{

const agora = new Date();
const diff = dataEvento - agora;

const dias = Math.floor(diff / (1000*60*60*24));
const horas = Math.floor((diff / (1000*60*60)) % 24);
const minutos = Math.floor((diff / (1000*60)) % 60);

document.getElementById("contador").innerText =
`Faltam ${dias} dias ${horas}h ${minutos}m`;

},1000);
</script>

</body>
</html>
