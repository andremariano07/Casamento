<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chá de Panela - Luiza & André</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<script>
(function(){
emailjs.init("3zU5_d_KcUdDLjXQY");
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Poppins',sans-serif;
color:white;
text-align:center;
overflow-x:hidden;
background:url('arte_casamento.jpeg') no-repeat center center/cover;
}

.overlay{
background:rgba(0,0,0,0.65);
min-height:100vh;
padding:20px;
position:relative;
z-index:2;
}

#tsparticles{
position:fixed;
width:100%;
height:100%;
z-index:1;
}

h1{
font-family:'Great Vibes',cursive;
font-size:60px;
margin-top:40px;
background:linear-gradient(45deg,#fff,#f8e7b0,#d4af37,#fff);
background-size:300%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 6s infinite linear, fadeIn 2s ease;
padding:0 20px;
}

@keyframes shine{
0%{background-position:0%}
100%{background-position:300%}
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(30px)}
to{opacity:1;transform:translateY(0)}
}

.date{
margin-top:15px;
font-size:20px;
}

#countdown{
font-size:22px;
margin-top:10px;
}

.location{
margin-top:10px;
font-size:18px;
}

.maps-btn{
margin-top:10px;
padding:10px 20px;
border:none;
border-radius:30px;
background:#d4af37;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.maps-btn:hover{
background:#fff;
}

.container{
display:flex;
justify-content:center;
flex-wrap:wrap;
margin-top:40px;
gap:20px;
position:relative;
z-index:2;
}

.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:20px;
padding:15px;
width:260px;
transition:0.6s;
opacity:0;
transform:translateY(40px);
animation:cardEntrance 1s forwards;
}

.card:nth-child(2){
animation-delay:0.3s;
}

@keyframes cardEntrance{
to{
opacity:1;
transform:translateY(0);
}
}

.card:hover{
transform:translateY(-8px) scale(1.02);
}

.card img{
width:100%;
height:170px;
object-fit:cover;
border-radius:15px;
}

button{
margin-top:10px;
padding:8px 15px;
border:none;
border-radius:20px;
background:#d4af37;
color:black;
cursor:pointer;
font-weight:bold;
}

button:disabled{
background:gray;
cursor:not-allowed;
}

input{
margin-top:8px;
padding:8px;
width:90%;
border-radius:15px;
border:none;
text-align:center;
}

/* 📱 AJUSTE CELULAR REAL */
@media(max-width:600px){

h1{font-size:42px}

.card{
width:90%;
padding:12px;
}

.card img{
height:140px;
}

.date, #countdown, .location{
font-size:16px;
}

.maps-btn{
padding:8px 16px;
font-size:14px;
}
}
</style>
</head>

<body>

<div id="tsparticles"></div>

<div class="overlay">

<h1>Luiza & André</h1>

<div class="date">20/06/2026 - 18:00 horas</div>
<div id="countdown"></div>

<div class="location">
Rua Vera Lucia, 215 - Sinimbu
</div>

<button class="maps-btn" onclick="abrirMapa()">Ver no Maps</button>

<div class="container">

<div class="card" id="Geladeira">
  <img src="Imagens/geladeira.png" alt="Geladeira">
  <h3>Geladeira</h3>
  <input type="text" placeholder="Seu nome" id="nome-Geladeira">
  <input type="email" placeholder="Seu e-mail" id="email-Geladeira">
  <button onclick="reservar('Geladeira')">Reservar</button>
</div>

<div class="card" id="Fogao">
<img src="https://images.unsplash.com/photo-1586201375761-83865001e17b">
<h3>Fogão</h3>
<input type="text" placeholder="Seu nome" id="nome-Fogao">
<input type="email" placeholder="Seu e-mail" id="email-Fogao">
<button onclick="reservar('Fogao')">Reservar</button>
</div>

</div>
</div>

<script>
// 🎆 PARTÍCULAS DOURADAS LEVES
tsParticles.load("tsparticles", {
particles:{
number:{value:40},
color:{value:"#d4af37"},
shape:{type:"circle"},
opacity:{value:0.5},
size:{value:3},
move:{
enable:true,
speed:0.6
}
},
background:{color:"transparent"}
});

// CONTADOR
var countDownDate = new Date("Jun 20, 2026 18:00:00").getTime();

setInterval(function() {
var now = new Date().getTime();
var distance = countDownDate - now;

var days = Math.floor(distance / (1000 * 60 * 60 * 24));
var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
var seconds = Math.floor((distance % (1000 * 60)) / 1000);

document.getElementById("countdown").innerHTML =
days + " dias " + hours + "h " + minutes + "m " + seconds + "s ";

}, 1000);

// MAPS
function abrirMapa(){
window.open("https://www.google.com/maps/search/?api=1&query=Rua+Vera+Lucia+215+Sinimbu");
}

// RESERVA
function reservar(item){

let nome = document.getElementById("nome-"+item).value;
let email = document.getElementById("email-"+item).value;

if(nome==="" || email===""){
alert("Preencha nome e e-mail");
return;
}

emailjs.send("service_7b5jpat","template_kl4avko",{
nome:nome,
email:email,
mensagem:"Obrigado por participar deste momento, estamos muito felizes por tudo."
});

let card = document.getElementById(item);
card.querySelector("button").disabled = true;
card.querySelector("button").innerText = "Indisponível";

card.querySelectorAll("input").forEach(input=>{
input.style.display="none";
});
}
</script>

</body>
</html>
