  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root{

    body{

    .overlay{

    #tsparticles { position:fixed; width:100%; height:100%; z-index:1; pointer-events: none; }

    /* --- NAVEGAÇÃO --- */
    #intro-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; animation: fadeIn 1.5s ease; }
    #lista-presentes { display: none; width: 100%; animation: fadeIn 1s ease; }

      animation: fadeIn 1.2s ease;

    #lista-presentes { display: none; width: 100%; animation: fadeIn 0.9s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(16px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    /* --- AJUSTE DO TÍTULO (NOME) --- */
    /* --- TÍTULO (NOME) – corrigido para não cortar --- */
    h1 {
      font-family:'Great Vibes', cursive;
      font-size: 70px;
      line-height: 1.4; /* Espaço extra para não cortar o acento ou as letras */

      margin-bottom: 10px;
      background: linear-gradient(45deg,#fff,#f8e7b0,#d4af37,#fff);

      margin: 8px 0 12px;
      padding: 6px 10px;           /* espaço interno evita clipping do gradient clip */
      display: inline-block;       /* evita colapsos estranhos */
      overflow: visible;           /* garante que nada seja cortado */
      text-wrap: balance;          /* melhor quebra (quando suportado) */

      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s infinite linear;
      word-wrap: break-word;
      text-shadow: 0 0 12px rgba(212,175,55,0.25); /* dá acabamento e evita serrilhado */
    }

    @keyframes shine { 0%{background-position:0%} 100%{background-position:300%} }
    @keyframes shine { 
      0%{background-position:0%} 
      100%{background-position:300%} 
    }

    /* --- ESTILOS DA CAPA --- */
    /* --- CAPA --- */
    .foto-casal {

      border-radius: 50%;

    .btn-gold:hover { 
      background: #fff; 
      transform: translateY(-2px) scale(1.03); 
      box-shadow: 0 10px 22px rgba(212,175,55,0.45); 
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #d4af37;

      border: 1px solid var(--gold-1);

      padding: 10px 25px;

    .btn-outline:hover {

      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(212,175,55,0.32);
    }

    /* --- LISTA DE PRESENTES --- */
    .container { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 30px; }
    .container { 
      display: flex; 
      justify-content: center; 
      flex-wrap: wrap; 
      gap: 22px; 
      margin-top: 30px; 
      perspective: 1000px; /* ajuda no tilt 3D */
    }

    .card {
      background: rgba(255,255,255,0.08);
      position: relative;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 15px;
      width: 260px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 16px;
      width: 270px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 220ms ease, box-shadow 220ms ease;
      transform-style: preserve-3d;
      will-change: transform, box-shadow;
      isolation: isolate; /* para pseudo-elements */
    }

    /* Borda dourada animada com glow */
    .card::before {
      content: "";
      position: absolute;
      inset: -2px;       /* cria borda externa */
      border-radius: 22px;
      background: conic-gradient(
        from 0deg,
        #fff0,
        var(--gold-3),
        var(--gold-2),
        var(--gold-1),
        var(--gold-2),
        #fff0
      );
      z-index: -1;
      filter: blur(0.6px);
      animation: spinGold 6s linear infinite;
      opacity: 0.85;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 28px;
      background: radial-gradient(closest-side, rgba(212,175,55,0.22), transparent 70%);
      z-index: -2;
      filter: blur(14px);
      opacity: 0.65;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    @keyframes spinGold {
      to { transform: rotate(360deg); }
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 18px 38px rgba(212,175,55,0.25), 0 8px 22px rgba(0,0,0,0.35);
    }
    .card:hover::after { opacity: 0.9; }

    .card h3 { 
      margin: 10px 0 8px; 
      font-weight: 600; 
      letter-spacing: 0.2px;
      color: #fff;
      text-shadow: 0 0 8px rgba(212,175,55,0.18);
    }

    .card img { 
      width: 100%; 
      height: 200px; 
      object-fit: cover; 
      border-radius: 15px; 
      box-shadow: 0 10px 18px rgba(0,0,0,0.35), 0 0 0 1px rgba(212,175,55,0.25) inset;
    }

    input { 
      width: 90%; 
      padding: 10px; 
      margin-bottom: 10px; 
      border-radius: 10px; 
      border: none; 
      text-align: center; 
      background: rgba(255,255,255,0.92);
      color: #222;
      outline: none;
      transition: box-shadow 0.2s ease;
    }
    input:focus{
      box-shadow: 0 0 0 3px rgba(212,175,55,0.35);
    }

    /* Tilt baseado no mouse (desktop) */
    @media (hover: hover) and (pointer: fine) {
      .card[data-tilt="1"] { transition: transform 80ms ease; }
    }
    .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; }
    input { width: 90%; padding: 10px; margin-bottom: 10px; border-radius: 10px; border: none; text-align: center; }

    @media(max-width: 600px) {
      h1 { font-size: 50px; line-height: 1.2; }
      h1 { font-size: 54px; line-height: 1.22; padding-inline: 8px; }
      .foto-casal { width: 180px; height: 180px; }
      .card { width: 92vw; max-width: 360px; }
    }
  </style>
</head>

<body>

  <div id="tsparticles"></div>

  <div class="overlay">

    <section id="intro-page">

  <script>
    function abrirPresentes() {
      document.getElementById('intro-page').style.display = 'none';
      document.getElementById('lista-presentes').style.display = 'block';
      window.scrollTo(0,0);
    }

    function voltarIntro() {
      document.getElementById('lista-presentes').style.display = 'none';
      document.getElementById('intro-page').style.display = 'flex';
    }

    // Contagem Regressiva
    var countDownDate = new Date("Jun 20, 2026 18:00:00").getTime();
    setInterval(function() {
      var now = new Date().getTime();
      var distance = countDownDate - now;
      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((distance % (1000 * 60)) / 1000);
      document.getElementById("countdown").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
    }, 1000);

    function abrirMapa(){
      window.open(`https://www.google.com/maps/search/?api=1&query=Rua+Vera+Lucia+215+Sinimbu`, "_blank");
    }

    const audio = document.getElementById("bgMusic");
    function tocarMusica() {
      if (audio.paused) { audio.play(); document.getElementById("music-btn").innerText = "🔇 Pausar"; }
      else { audio.pause(); document.getElementById("music-btn").innerText = "🎵 Música"; }
    }

    // Partículas
    window.addEventListener('DOMContentLoaded', function(){
      if (window.tsParticles) {
        tsParticles.load("tsparticles", {
          particles:{ number:{value:30}, color:{value:"#d4af37"}, move:{enable:true,speed:0.5}, opacity:{value:0.4}, size:{value:2} }
          particles:{
            number:{value:30},
            color:{value:"#d4af37"},
            move:{enable:true,speed:0.5},
            opacity:{value:0.4},
            size:{value:2}
          }
        });
      }
    });

    // Tilt sutil baseado no mouse (desktop) para os cards
    (function enableTilt(){
      const supportsHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      if(!supportsHover) return;

      const maxTilt = 8; // graus
      const cards = document.querySelectorAll('.card[data-tilt="1"]');

      function handleMove(e){
        const card = e.currentTarget;
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        const dx = (e.clientX - cx) / (rect.width/2);
        const dy = (e.clientY - cy) / (rect.height/2);
        const tiltX = (+dy * maxTilt).toFixed(2);
        const tiltY = (-dx * maxTilt).toFixed(2);
        card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateY(-4px) scale(1.02)`;
      }
      function resetTilt(e){
        const card = e.currentTarget;
        card.style.transform = '';
      }

      cards.forEach(c=>{
        c.addEventListener('mousemove', handleMove);
        c.addEventListener('mouseleave', resetTilt);
      });
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBv1JPd9CIzGsdEAEozbns7O87ct11dbIw",
      authDomain: "casamento-luiza-andre.firebaseapp.com",
      projectId: "casamento-luiza-andre",
      storageBucket: "casamento-luiza-andre.firebasestorage.app",
      messagingSenderId: "79078651574",
      appId: "1:79078651574:web:71d4b92e7ed41de2c49817"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ITENS = ["Geladeira", "Cooktop", "Jogo de Panela", "Microondas"];

    ITENS.forEach(item => {
      onSnapshot(doc(db, "reservas", item), (snap) => {
        const card = document.getElementById(item);
        if (!card) return;
        const btn = card.querySelector("button");
        if (snap.exists() && snap.data().reservado) {
          card.querySelector("button").disabled = true;
          card.querySelector("button").innerText = "Reservado";
          card.querySelectorAll("input").forEach(i => i.style.display = "none");
        }
      });
    });

    window.Presentear = async function(item){
      const nome = document.getElementById("nome-"+item).value;
      const email = document.getElementById("email-"+item).value;
      if(!nome || !email) return alert("Preencha os campos!");
      
      try {
        await runTransaction(db, async (t) => {
          const ref = doc(db, "reservas", item);
          const s = await t.get(ref);
          if(s.exists() && s.data().reservado) throw "Item já reservado";
          t.set(ref, {reservado:true, nome, email, ts: serverTimestamp()});
        });
        alert("Sucesso!");
      } catch(e) { alert(e); }
    }
  </script>
