<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luiza & André</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
  emailjs.init("YOUR_PUBLIC_KEY");
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  color:white;
  text-align:center;
  min-height:100vh;
  background-image:url('arte_casamento.jpeg');
  background-position:center center;
  background-repeat:no-repeat;
  background-size:cover;
  background-attachment:fixed;
}

/* PRE CAPA */
.precapa{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.foto-casal{
  width:160px;
  height:160px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid gold;
  box-shadow:0 0 25px rgba(255,215,0,0.6);
  margin-bottom:20px;
}

.precapa h1{
  font-weight:600;
  margin-bottom:20px;
}

.precapa button{
  padding:12px 30px;
  border:none;
  border-radius:25px;
  background:gold;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.precapa button:hover{
  transform:scale(1.05);
}

/* CONTAINER PRINCIPAL */
.container{
  padding:40px 20px;
  display:none;
}

h2{
  margin-bottom:20px;
}

.card{
  background:rgba(0,0,0,0.6);
  padding:20px;
  border-radius:15px;
  margin:20px auto;
  max-width:400px;
  transition:0.5s;
  position:relative;
}

.card.reservado{
  border:2px solid gold;
  box-shadow:0 0 25px rgba(255,215,0,0.7);
}

.card input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
}

.card button{
  padding:10px 20px;
  border:none;
  border-radius:25px;
  background:gold;
  color:black;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.card button:disabled{
  background:#aaa;
  cursor:not-allowed;
}

@keyframes brilho{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

.card.animar{
  animation:brilho 0.6s ease;
}
</style>
</head>
<body>

<!-- PRÉ CAPA -->
<div class="precapa" id="precapa">
<img src="nos.jpeg" class="foto-casal">
<h1>Luiza & André</h1>
<button onclick="entrar()">Entrar</button>
</div>

<!-- CONTEÚDO -->
<div class="container" id="conteudo">
<h2>Lista de Casamento</h2>

<div class="card" id="card-Geladeira">
<h3>Geladeira</h3>
<input type="text" id="nome-Geladeira" placeholder="Seu nome">
<input type="email" id="email-Geladeira" placeholder="Seu e-mail">
<button id="btn-Geladeira" onclick="Presentear('Geladeira')">Presentear</button>
</div>

</div>

<!-- MÚSICA -->
<audio id="bgMusic" loop>
<source src="https://media.vocaroo.com/mp3/1c3ZGc93IyZe" type="audio/mpeg">
</audio>

<script>
function entrar(){
  document.getElementById("precapa").style.display="none";
  document.getElementById("conteudo").style.display="block";

  const audio = document.getElementById("bgMusic");
  audio.volume=0;
  audio.play();

  let fade=setInterval(()=>{
    if(audio.volume<0.3){
      audio.volume+=0.02;
    }else{
      clearInterval(fade);
    }
  },200);
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBv1JPd9CIzGsdEAEozbns7O87ct11dbIw",
  authDomain: "casamento-luiza-andre.firebaseapp.com",
  projectId: "casamento-luiza-andre",
  storageBucket: "casamento-luiza-andre.firebasestorage.app",
  messagingSenderId: "79078651574",
  appId: "1:79078651574:web:71d4b92e7ed41de2c49817"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

window.Presentear = async function(item){

  const nomeInput  = document.getElementById("nome-"+item);
  const emailInput = document.getElementById("email-"+item);
  const btn        = document.getElementById("btn-"+item);
  const card       = document.getElementById("card-"+item);

  const nome  = nomeInput.value.trim();
  const email = emailInput.value.trim();

  if(!nome || !email){
    alert("Preencha nome e e-mail");
    return;
  }

  const ref = doc(db,"reservas",item);

  try{
    await runTransaction(db, async (transaction)=>{
      const snap = await transaction.get(ref);
      if(snap.exists() && snap.data().reservado){
        throw "ja_reservado";
      }
      transaction.set(ref,{
        reservado:true,
        nome,
        email,
        ts:serverTimestamp()
      });
    });

    await emailjs.send("service_7b5jpat","template_kl4avko",{
      nome,
      email,
      item,
      mensagem:"Obrigado por participar deste momento!"
    });

    btn.innerText="Reservado ✓";
    btn.disabled=true;
    card.classList.add("reservado");
    card.classList.add("animar");

    alert("Reserva realizada com sucesso! ✨");

  }catch(e){
    if(e==="ja_reservado"){
      btn.innerText="Reservado ✓";
      btn.disabled=true;
      card.classList.add("reservado");
      alert("Este item já foi reservado.");
    }else{
      console.error(e);
      alert("Erro ao reservar.");
    }
  }
}
</script>

</body>
</html>
