<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chá de Panela - Luiza & André</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- EmailJS e tsParticles -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js" defer></script>

<script>
window.addEventListener('DOMContentLoaded', function () {
  try { emailjs.init("3zU5_d_KcUdDLjXQY"); } catch(e){ console.error('Falha ao inicializar EmailJS', e); }
});
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  color:white;
  text-align:center;
  overflow-x:hidden;
  background:#000;
}

#tsparticles{position:fixed;width:100%;height:100%;z-index:1;}

/* PRÉ-CAPA */
.precover{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.75) url('nos.png') center center/cover no-repeat;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.precover h1{
  font-family:'Great Vibes',cursive;
  font-size:60px;
  background:linear-gradient(45deg,#fff,#f8e7b0,#d4af37,#fff);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s infinite linear, fadeIn 2s ease;
  margin-bottom:15px;
}

.precover .date, .precover #countdown, .precover .location{
  margin:5px 0;
}

.precover .maps-btn, .precover #music-btn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.precover .maps-btn:hover, .precover #music-btn:hover{background:#fff;}

@keyframes shine{
  0%{background-position:0%}
  100%{background-position:300%}
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* LAYOUT PRINCIPAL */
.overlay{
  background:rgba(0,0,0,0.65);
  min-height:100vh;
  padding:20px;
  position:relative;
  z-index:2;
  display:none; /* Inicialmente escondido */
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:60px;
  margin-top:40px;
  background:linear-gradient(45deg,#fff,#f8e7b0,#d4af37,#fff);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s infinite linear, fadeIn 2s ease;
  padding:0 20px;
}

.date{margin-top:15px;font-size:20px;}
#countdown{font-size:22px;margin-top:10px;}
.location{margin-top:10px;font-size:18px;}

.maps-btn{margin-top:10px;padding:10px 20px;border:none;border-radius:30px;background:#d4af37;color:black;font-weight:bold;cursor:pointer;transition:0.3s;}
.maps-btn:hover{background:#fff;}

.container{display:flex;justify-content:center;flex-wrap:wrap;margin-top:40px;gap:20px;position:relative;z-index:2;}
.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:15px;
  width:260px;
  transition:0.6s;
  opacity:0;
  transform:translateY(40px);
  animation:cardEntrance 1s forwards, floatCard 6s ease-in-out infinite;
  position:relative;
  overflow:hidden;
}

.card img{width:100%;height:auto;border-radius:15px;border:2px solid rgba(212,175,55,0.7);box-shadow:0 10px 25px rgba(0,0,0,0.35);transition:transform 0.6s ease, box-shadow 0.6s ease;position:relative;z-index:1;}
.card:hover img{transform:scale(1.05);box-shadow:0 15px 35px rgba(0,0,0,0.5);}

@keyframes cardEntrance{to{opacity:1;transform:translateY(0);}}
@keyframes floatCard{0%{transform:translateY(0px);}50%{transform:translateY(-6px);}100%{transform:translateY(0px);}}

button{margin-top:10px;padding:8px 15px;border:none;border-radius:20px;background:#d4af37;color:black;cursor:pointer;font-weight:bold;}
button:disabled{background:gray;cursor:not-allowed;}
input{margin-top:8px;padding:8px;width:90%;border-radius:15px;border:none;text-align:center;}

@media(max-width:600px){
h1{font-size:42px}
.card{width:90%;padding:12px;}
.date,#countdown,.location{font-size:16px;}
.maps-btn{padding:8px 16px;font-size:14px;}
}
</style>
</head>

<body>

<div id="tsparticles"></div>

<!-- PRÉ-CAPA -->
<div class="precover" id="precover">
  <h1>Luiza & André</h1>
  <div class="date">20/06/2026 - 18:00 horas</div>
  <div id="countdown"></div>
  <div class="location">Rua Vera Lucia, 215 - Sinimbu</div>
  <button class="maps-btn" onclick="abrirMapa()">Ver no Maps</button>
  <button class="maps-btn" onclick="entrarEvento()" id="music-btn">🎵 Tocar Música</button>
</div>

<!-- MÚSICA -->
<audio id="bgMusic" loop>
  <source src="musica.mp3" type="audio/mpeg">
  Seu navegador não suporta áudio.
</audio>

<!-- CONTEÚDO PRINCIPAL -->
<div class="overlay" id="mainContent">

<h1>Luiza & André</h1>
<div class="date">20/06/2026 - 18:00 horas</div>
<div id="countdown"></div>
<div class="location">Rua Vera Lucia, 215 - Sinimbu</div>
<button class="maps-btn" onclick="abrirMapa()">Ver no Maps</button>

<div class="container">
  <div class="card" id="Geladeira">
    <img src="Imagens/geladeira.jpg" alt="Geladeira" loading="lazy">
    <h3>Geladeira</h3>
    <input type="text" placeholder="Seu nome" id="nome-Geladeira">
    <input type="email" placeholder="Seu e-mail" id="email-Geladeira">
    <button onclick="Presentear('Geladeira')">Presentear</button>
  </div>
  <div class="card" id="Microondas">
    <img src="Imagens/microondas.jpg" alt="Microondas" loading="lazy">
    <h3>Microondas</h3>
    <input type="text" placeholder="Seu nome" id="nome-Microondas">
    <input type="email" placeholder="Seu e-mail" id="email-Microondas">
    <button onclick="Presentear('Microondas')">Presentear</button>
  </div>
  <div class="card" id="Cooktop">
    <img src="Imagens/cooktop.png" alt="Cooktop" loading="lazy">
    <h3>Cooktop</h3>
    <input type="text" placeholder="Seu nome" id="nome-Cooktop">
    <input type="email" placeholder="Seu e-mail" id="email-Cooktop">
    <button onclick="Presentear('Cooktop')">Presentear</button>
  </div>
</div>
</div>

<script>
const countDownDate = new Date("Jun 20, 2026 18:00:00").getTime();
setInterval(() => {
  const now = new Date().getTime();
  const distance = countDownDate - now;
  const days = Math.floor(distance / (1000*60*60*24));
  const hours = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
  const minutes = Math.floor((distance % (1000*60*60))/(1000*60));
  const seconds = Math.floor((distance % (1000*60))/1000);
  document.querySelectorAll("#countdown").forEach(d => d.innerHTML = `${days} dias ${hours}h ${minutes}m ${seconds}s`);
},1000);

function abrirMapa(){
  const q = encodeURIComponent("Rua Vera Lucia, 215 - Sinimbu");
  window.open(`https://www.google.com/maps/search/?api=1&query=${q}`,"_blank","noopener");
}

// Pré-capa: entra no evento
const audio = document.getElementById("bgMusic");
const precover = document.getElementById("precover");
const mainContent = document.getElementById("mainContent");
function entrarEvento(){
  precover.style.display="none";
  mainContent.style.display="block";
  audio.volume=0;
  audio.play().then(() => {
    const start = Date.now();
    const fade = setInterval(() => {
      const elapsed = Date.now()-start;
      audio.volume = Math.min(0.3,(elapsed/4000)*0.3);
      if (elapsed>=4000) clearInterval(fade);
    },50);
  }).catch(console.error);
}
</script>

</body>
</html>
