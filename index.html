<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chá de Panela - Luiza & André</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Poppins;
background:#ffffff;
overflow-x:hidden;
}

/* HEADER PREMIUM */
header{
position:relative;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:0 15px;
background:
linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
url('arte_casamento.jpeg') center/cover no-repeat;
overflow:hidden;
}

/* PARTÍCULAS */
header::before{
content:"";
position:absolute;
width:200%;
height:200%;
background-image:radial-gradient(circle, rgba(212,175,55,0.8) 1px, transparent 1px);
background-size:40px 40px;
animation:particles 40s linear infinite;
opacity:0.3;
}

@keyframes particles{
from{transform:translateY(0);}
to{transform:translateY(-200px);}
}

/* ANIMAÇÃO CINEMATOGRÁFICA */
.titulo{
font-family:'Great Vibes', cursive;
font-size:80px;
padding:0 20px;
display:inline-block;
opacity:0;
transform:translateY(40px);
animation:entrada 2s ease forwards, gold 4s linear infinite 2s;

background:linear-gradient(90deg,#d4af37,#fff8dc,#d4af37);
background-size:200% auto;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

@keyframes entrada{
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes gold{
0%{background-position:0% center;}
100%{background-position:200% center;}
}

.subtitulo{
font-family:'Playfair Display';
font-size:28px;
margin-top:10px;
opacity:0;
animation:fadeIn 2s ease forwards 1s;
}

.data{
margin-top:10px;
font-size:18px;
opacity:0;
animation:fadeIn 2s ease forwards 1.5s;
}

#contador{
margin-top:20px;
font-size:20px;
font-weight:bold;
opacity:0;
animation:fadeIn 2s ease forwards 2s;
}

@keyframes fadeIn{
to{opacity:1;}
}

/* LISTA */
.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:60px 20px;
gap:25px;
background:#f9f6f0;
}

.card{
background:white;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
width:260px;
padding:18px;
transition:0.4s;
}

.card img{
width:100%;
border-radius:10px;
}

input{
width:92%;
padding:8px;
margin-top:8px;
border-radius:8px;
border:1px solid #ccc;
}

button{
margin-top:10px;
padding:9px 18px;
border:none;
border-radius:8px;
background:#d4af37;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#b8962f;
}

.reservado{
color:red;
font-weight:bold;
margin-top:8px;
}

/* RESPONSIVO */
@media(max-width:768px){
.titulo{font-size:55px;}
.container{
padding:40px 10px;
gap:15px;
}
.card{
width:90%;
padding:15px;
}
}
</style>
</head>

<body>

<header>
<h1 class="titulo">Luiza & André</h1>
<p class="subtitulo">Chá de Panela</p>
<p class="data">20/06/2026</p>
<div id="contador"></div>
</header>

<div class="container">

<div class="card">
<img src="https://images.tcdn.com.br/img/img_prod/1102878/geladeira_branca_375l_2159_1.jpg">
<h3>Geladeira</h3>
<input placeholder="Seu nome" id="nome-geladeira">
<input placeholder="Seu e-mail" id="email-geladeira">
<button onclick="reservar('geladeira')">Reservar</button>
<div id="status-geladeira"></div>
</div>

<div class="card">
<img src="https://images.tcdn.com.br/img/img_prod/1102878/fogao_branco_4_bocas_2165_1.jpg">
<h3>Fogão</h3>
<input placeholder="Seu nome" id="nome-fogao">
<input placeholder="Seu e-mail" id="email-fogao">
<button onclick="reservar('fogao')">Reservar</button>
<div id="status-fogao"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("3zU5_d_KcUdDLjXQY");
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBv1JPd9CIzGsdEAEozbns7O87ct11dbIw",
authDomain: "casamento-luiza-andre.firebaseapp.com",
projectId: "casamento-luiza-andre",
storageBucket: "casamento-luiza-andre.firebasestorage.app",
messagingSenderId: "79078651574",
appId: "1:79078651574:web:71d4b92e7ed41de2c49817"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.reservar = async function(item){

let nome = document.getElementById("nome-"+item).value;
let email = document.getElementById("email-"+item).value;

if(!nome || !email){
alert("Preencha nome e e-mail");
return;
}

const docRef = doc(db,"reservas",item);
const docSnap = await getDoc(docRef);

if(docSnap.exists()){
alert("Item já reservado");
return;
}

await setDoc(docRef,{nome:nome,email:email});

/* MENSAGEM DEFINITIVA */
let mensagemPersonalizada = 
"Obrigado por participar deste momento, estamos muito felizes por tudo.";

emailjs.send("service_7b5jpat","template_kl4avko",{
item:item,
nome:nome,
email:email,
mensagem:mensagemPersonalizada
});

alert("Reserva realizada! Você receberá um e-mail de confirmação.");
location.reload();
}

async function verificar(){
const itens = ["geladeira","fogao"];
for(let item of itens){
const status = document.getElementById("status-"+item);
const docRef = doc(db,"reservas",item);
const docSnap = await getDoc(docRef);
if(docSnap.exists()){
status.innerHTML = "<div class='reservado'>Item já reservado</div>";
}
}
}

verificar();
</script>

<script>
const dataEvento = new Date("June 20, 2026 00:00:00");
setInterval(()=>{
const agora = new Date();
const diff = dataEvento - agora;
const dias = Math.floor(diff / (1000*60*60*24));
const horas = Math.floor((diff / (1000*60*60)) % 24);
const minutos = Math.floor((diff / (1000*60)) % 60);
document.getElementById("contador").innerText =
`Faltam ${dias} dias ${horas}h ${minutos}m`;
},1000);
</script>

</body>
</html>
