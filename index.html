<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Casamento</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
  emailjs.init("YOUR_PUBLIC_KEY");
})();
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  color:white;
  text-align:center;
  min-height:100vh;
  background-image:url('arte_casamento.jpeg');
  background-position:center center;
  background-repeat:no-repeat;
  background-size:cover;
  background-attachment:fixed;
}

.container{
  padding:40px 20px;
}

h1{
  margin-bottom:30px;
  font-weight:600;
}

.card{
  background:rgba(0,0,0,0.6);
  padding:20px;
  border-radius:15px;
  margin:20px auto;
  max-width:400px;
  transition:0.5s;
  position:relative;
}

.card.reservado{
  border:2px solid gold;
  box-shadow:0 0 25px rgba(255,215,0,0.6);
}

.card h2{
  margin-bottom:15px;
}

.card input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
}

.card button{
  padding:10px 20px;
  border:none;
  border-radius:25px;
  background:gold;
  color:black;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.card button:disabled{
  background:#aaa;
  cursor:not-allowed;
}

/* animação elegante */
@keyframes brilho{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

.card.animar{
  animation:brilho 0.6s ease;
}
</style>
</head>
<body>

<div class="container">
<h1>Lista de Casamento</h1>

<div class="card" id="card-Geladeira">
<h2>Geladeira</h2>
<input type="text" id="nome-Geladeira" placeholder="Seu nome">
<input type="email" id="email-Geladeira" placeholder="Seu e-mail">
<button id="btn-Geladeira" onclick="Presentear('Geladeira')">Presentear</button>
</div>

<div class="card" id="card-Microondas">
<h2>Microondas</h2>
<input type="text" id="nome-Microondas" placeholder="Seu nome">
<input type="email" id="email-Microondas" placeholder="Seu e-mail">
<button id="btn-Microondas" onclick="Presentear('Microondas')">Presentear</button>
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBv1JPd9CIzGsdEAEozbns7O87ct11dbIw",
  authDomain: "casamento-luiza-andre.firebaseapp.com",
  projectId: "casamento-luiza-andre",
  storageBucket: "casamento-luiza-andre.firebasestorage.app",
  messagingSenderId: "79078651574",
  appId: "1:79078651574:web:71d4b92e7ed41de2c49817"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

window.Presentear = async function(item){

  const nomeInput  = document.getElementById("nome-"+item);
  const emailInput = document.getElementById("email-"+item);
  const btn        = document.getElementById("btn-"+item);
  const card       = document.getElementById("card-"+item);

  const nome  = nomeInput.value.trim();
  const email = emailInput.value.trim();

  if(!nome || !email){
    alert("Preencha nome e e-mail");
    return;
  }

  const ref = doc(db,"reservas",item);

  try{
    await runTransaction(db, async (transaction)=>{
      const snap = await transaction.get(ref);
      if(snap.exists() && snap.data().reservado){
        throw "ja_reservado";
      }
      transaction.set(ref,{
        reservado:true,
        nome,
        email,
        ts:serverTimestamp()
      });
    });

    await emailjs.send("service_7b5jpat","template_kl4avko",{
      nome,
      email,
      item,
      mensagem:"Obrigado por participar deste momento!"
    });

    // 🔥 Atualização visual automática
    btn.innerText = "Reservado ✓";
    btn.disabled = true;
    card.classList.add("reservado");
    card.classList.add("animar");

    alert("Reserva realizada com sucesso! ✨");

  }catch(e){
    if(e === "ja_reservado"){
      alert("Este item já foi reservado.");
      btn.innerText = "Reservado ✓";
      btn.disabled = true;
      card.classList.add("reservado");
    } else {
      console.error(e);
      alert("Erro ao reservar. Tente novamente.");
    }
  }
}
</script>

</body>
</html>
