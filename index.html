<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chá de Panela - Luiza & André</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js" defer></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
:root{ --gold:#d4af37; --gold2:#f8e7b0; }

body{
  font-family:Poppins,sans-serif;
  color:#fff;
  text-align:center;
  min-height:100svh;
  overflow-x:hidden;
  background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url('arte_casamento.jpeg');
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
  background-attachment:fixed;
}
@media(max-width:768px){ body{background-attachment:scroll;} }

#tsparticles{
  position:fixed; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:1;
}

/* ===== ANIMAÇÃO SUAVE ===== */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(25px); }
  to   { opacity:1; transform:translateY(0); }
}
.fade-up{
  opacity:0;
  animation:fadeUp 1.2s ease forwards;
}

/* PRÉ CAPA */
.precover{
  position:fixed; inset:0;
  background:rgba(0,0,0,.65);
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  padding:20px; z-index:10;
}

.circle-photo{
  width:180px;height:180px;border-radius:50%;
  overflow:hidden;border:5px solid var(--gold);
  margin-bottom:20px;
  box-shadow:0 0 15px rgba(212,175,55,.6);
}
.circle-photo img{width:100%;height:100%;object-fit:cover}

.pre-title{
  font-family:'Great Vibes',cursive;
  font-size:clamp(30px,6vw,52px);
  margin-bottom:6px;
  background:linear-gradient(45deg,#fff,var(--gold2),var(--gold),#fff);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s infinite linear;
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:clamp(38px,7vw,64px);
  line-height:1.1;
  background:linear-gradient(45deg,#fff,var(--gold2),var(--gold),#fff);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s infinite linear;
}
@keyframes shine{to{background-position:300%}}

.date,.countdown,.location{margin:8px 0;font-size:20px}

/* BOTÕES */
.btn, button{
  position:relative;
  margin-top:12px;
  padding:10px 22px;
  border:none;
  border-radius:30px;
  background:var(--gold);
  color:#111;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  overflow:hidden;
}
.btn:hover{transform:translateY(-2px)}

/* RIPPLE */
.ripple{
  position:absolute;
  border-radius:50%;
  transform:scale(0);
  animation:ripple .6s ease-out;
  background:radial-gradient(circle, rgba(248,231,176,.9) 0%, rgba(212,175,55,.6) 40%, rgba(212,175,55,0) 70%);
  pointer-events:none;
}
@keyframes ripple{ to{ transform:scale(4); opacity:0; } }

/* OVERLAY PRINCIPAL */
.overlay{
  display:none;
  position:relative;
  z-index:2;
  min-height:100svh;
  padding:20px 20px 70px;
  background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),url('arte_casamento.jpeg');
  background-size:cover;
  background-position:center top;
  background-attachment:fixed;
}
@media(max-width:768px){ .overlay{background-attachment:scroll;} }

/* GRID */
.container{
  width:min(980px, 100%);
  margin:40px auto 0;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 260px));
  justify-content:center;
  gap:20px;
}
@media(max-width:420px){ .container{ grid-template-columns:1fr; } }

/* CARD */
.card{
  width:260px;
  padding:15px;
  border-radius:22px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  transition:.25s;
}
.card:hover{transform:translateY(-6px)}

.product-img{
  width:100%;
  aspect-ratio:4/3;
  background:#fff;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.product-img img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:8px;
}

input{
  margin-top:8px;
  padding:10px;
  width:92%;
  border-radius:18px;
  border:none;
  text-align:center;
}

.badge{
  display:inline-block;
  margin-top:10px;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  background:rgba(212,175,55,.22);
}

.modal{
  position:fixed; inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.6);
  z-index:999;
}
.modal.show{display:flex}
.modal-box{
  background:#1c1c1c;
  padding:20px;
  border-radius:18px;
  width:90%;
  max-width:400px;
}
</style>
</head>

<body>

<div id="tsparticles"></div>

<!-- PRÉ CAPA -->
<div class="precover" id="precover">

  <div class="circle-photo fade-up" style="animation-delay:.2s;">
    <img src="nos.jpeg">
  </div>

  <div class="pre-title fade-up" style="animation-delay:.6s;">
    Chá de Panela
  </div>

  <h1 class="fade-up" style="animation-delay:1s;">
    Luiza & André
  </h1>

  <div class="date fade-up" style="animation-delay:1.4s;">
    20/06/2026 - 18:00 horas
  </div>

  <div class="countdown fade-up" id="countdown-pre" style="animation-delay:1.6s;"></div>

  <div class="location fade-up" style="animation-delay:1.8s;">
    Rua Vera Lucia, 215 - Sinimbu
  </div>

  <button class="btn fade-up" onclick="abrirMapa()" style="animation-delay:2s;">Ver no Maps</button>
  <button class="btn fade-up" onclick="tocarMusica()" style="animation-delay:2.2s;">Tocar Música</button>
  <button class="btn fade-up" onclick="entrarEvento()" style="animation-delay:2.4s;">Lista de Presente</button>

</div>

<audio id="bgMusic" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- CONTEÚDO PRINCIPAL -->
<div class="overlay" id="mainContent">
  <h1>Luiza & André</h1>
  <div class="date">20/06/2026 - 18:00 horas</div>
  <div class="countdown" id="countdown-main"></div>
  <button class="btn" onclick="voltarPreCapa()">Voltar</button>

  <div class="container">

    <!-- EXEMPLO DE CARD -->
    <div class="card">
      <div class="product-img"><img src="Imagens/geladeira.jpg"></div>
      <h3>Geladeira</h3>
      <div class="badge">Disponível</div>
      <input type="text" placeholder="Seu nome">
      <input type="email" placeholder="Seu e-mail">
      <button class="btn">Presentear</button>
    </div>

  </div>
</div>

<script>
/* COUNTDOWN */
const target = new Date("Jun 20, 2026 18:00:00").getTime();
setInterval(()=>{
  const diff = target - Date.now();
  const s = Math.floor(diff/1000)%60;
  const m = Math.floor(diff/60000)%60;
  const h = Math.floor(diff/3600000)%24;
  const d = Math.floor(diff/86400000);
  const txt = `${d} dias ${h}h ${m}m ${s}s`;
  document.getElementById("countdown-pre").textContent = txt;
  document.getElementById("countdown-main").textContent = txt;
},1000);

/* MAPA */
function abrirMapa(){
  const q = encodeURIComponent("Rua Vera Lucia, 215 - Sinimbu");
  window.open(`https://www.google.com/maps/search/?api=1&query=${q}`,"_blank");
}

/* MÚSICA */
const audio = document.getElementById("bgMusic");
async function tocarMusica(){
  if(audio.paused){
    audio.volume = 0.1;
    await audio.play();
  }else{
    audio.pause();
  }
}

/* NAVEGAÇÃO */
function entrarEvento(){
  document.getElementById("precover").style.display="none";
  document.getElementById("mainContent").style.display="block";
}
function voltarPreCapa(){
  document.getElementById("mainContent").style.display="none";
  document.getElementById("precover").style.display="flex";
}

/* RIPPLE */
document.addEventListener("click",(e)=>{
  const btn=e.target.closest("button");
  if(!btn) return;
  const rect=btn.getBoundingClientRect();
  const ripple=document.createElement("span");
  ripple.className="ripple";
  const size=Math.max(rect.width,rect.height);
  ripple.style.width=ripple.style.height=size+"px";
  ripple.style.left=(e.clientX-rect.left-size/2)+"px";
  ripple.style.top=(e.clientY-rect.top-size/2)+"px";
  btn.appendChild(ripple);
  ripple.addEventListener("animationend",()=>ripple.remove());
});
</script>

</body>
</html>
