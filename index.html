<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- EmailJS e tsParticles -->

<script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  color:white;
  text-align:center;
  overflow-x:hidden;
  background:url('arte_casamento.jpeg') no-repeat center center/cover;
}

#tsparticles{position:fixed;width:100%;height:100%;z-index:1;}

/* PRÉ-CAPA */
.precover{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.65);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
  padding:20px;
}

.precover h1{
  font-family:'Great Vibes',cursive;
  font-size:60px;
  background:linear-gradient(45deg,#fff,#f8e7b0,#d4af37,#fff);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s infinite linear, fadeIn 2s ease;
  margin-bottom:15px;
}

/* Bolinha da foto com borda animada */
.circle-photo{
  width:180px;
  height:180px;
  border-radius:50%;
  overflow:hidden;
  border:5px solid #d4af37;
  margin-bottom:20px;
  box-shadow:0 0 15px rgba(212,175,55,0.6);
  animation:shineBorder 3s linear infinite;
}

.circle-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

@keyframes shineBorder{
  0%{box-shadow:0 0 10px rgba(212,175,55,0.4);}
  50%{box-shadow:0 0 25px rgba(212,175,55,0.8);}
  100%{box-shadow:0 0 10px rgba(212,175,55,0.4);}
}

.precover .date, .precover #countdown, .precover .location{
  margin:5px 0;
  font-size:20px;
}

.precover .maps-btn, .precover #music-btn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
.precover .maps-btn:hover, .precover #music-btn:hover{background:#fff;}

@keyframes shine{
  0%{background-position:0%}
  100%{background-position:300%}
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* CONTEÚDO PRINCIPAL */
.overlay{
  background:rgba(0,0,0,0.65);
  min-height:100vh;
  padding:20px;
  position:relative;
  z-index:2;
  display:none;
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:60px;
  margin-top:40px;
  background:linear-gradient(45deg,#fff,#f8e7b0,#d4af37,#fff);
  background-size:300%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s infinite linear, fadeIn 2s ease;
  padding:0 20px;
}

.date{margin-top:15px;font-size:20px;}
#countdown{font-size:22px;margin-top:10px;}
.location{margin-top:10px;font-size:18px;}

.maps-btn{margin-top:10px;padding:10px 20px;border:none;border-radius:30px;background:#d4af37;color:black;font-weight:bold;cursor:pointer;transition:0.3s;}
.maps-btn:hover{background:#fff;}

.container{display:flex;justify-content:center;flex-wrap:wrap;margin-top:40px;gap:20px;position:relative;z-index:2;}
.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:15px;
  width:260px;
  transition:0.6s;
  opacity:0;
  transform:translateY(40px);
  animation:cardEntrance 1s forwards, floatCard 6s ease-in-out infinite;
  position:relative;
  overflow:hidden;
}

.card img{width:100%;height:auto;border-radius:15px;border:2px solid rgba(212,175,55,0.7);box-shadow:0 10px 25px rgba(0,0,0,0.35);transition:transform 0.6s ease, box-shadow 0.6s ease;position:relative;z-index:1;}
.card:hover img{transform:scale(1.05);box-shadow:0 15px 35px rgba(0,0,0,0.5);}

@keyframes cardEntrance{to{opacity:1;transform:translateY(0);}}
@keyframes floatCard{0%{transform:translateY(0px);}50%{transform:translateY(-6px);}100%{transform:translateY(0px);}}

button{margin-top:10px;padding:8px 15px;border:none;border-radius:20px;background:#d4af37;color:black;cursor:pointer;font-weight:bold;}
button:disabled{background:gray;cursor:not-allowed;}
input{margin-top:8px;padding:8px;width:90%;border-radius:15px;border:none;text-align:center;}

.back-btn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
.back-btn:hover{background:#fff;}

@media(max-width:600px){
h1{font-size:42px}
.card{width:90%;padding:12px;}
.date,#countdown,.location{font-size:16px;}
.maps-btn, .back-btn{padding:8px 16px;font-size:14px;}
}
</style>
</head>

<body>

<div id="tsparticles"></div>

<!-- PRÉ-CAPA -->
<div class="precover" id="precover">
  <div class="circle-photo">
    <img src="nos.png" alt="Nos Foto">
  </div>
  <h1>Luiza & André</h1>
  <div class="date">20/06/2026 - 18:00 horas</div>
  <div id="countdown"></div>
  <div class="location">Rua Vera Lucia, 215 - Sinimbu</div>
  <button class="maps-btn" onclick="abrirMapa()">Ver no Maps</button>
  <button class="maps-btn" id="music-btn-pre" onclick="tocarMusica()">🎵 Tocar Música</button>
  <button class="maps-btn" onclick="entrarEvento()">Entrar no Evento</button>
</div>

<!-- MÚSICA -->
<audio id="bgMusic" loop>
  <source src="musica.mp3" type="audio/mpeg">
  Seu navegador não suporta áudio.
</audio>

<!-- CONTEÚDO PRINCIPAL -->
<div class="overlay" id="mainContent">

<h1>Luiza & André</h1>
<div class="date">20/06/2026 - 18:00 horas</div>
<div id="countdown"></div>
<div class="location">Rua Vera Lucia, 215 - Sinimbu</div>
<button class="maps-btn" onclick="abrirMapa()">Ver no Maps</button>
<button class="back-btn" onclick="voltarPreCapa()">🔙 Voltar à Pré-Capa</button>

<div class="container">
  <div class="card" id="Geladeira">
    <img src="Imagens/geladeira.jpg" alt="Geladeira" loading="lazy">
    <h3>Geladeira</h3>
    <input type="text" placeholder="Seu nome" id="nome-Geladeira">
    <input type="email" placeholder="Seu e-mail" id="email-Geladeira">
    <button onclick="Presentear('Geladeira')">Presentear</button>
  </div>
  <div class="card" id="Microondas">
    <img src="Imagens/microondas.jpg" alt="Microondas" loading="lazy">
    <h3>Microondas</h3>
    <input type="text" placeholder="Seu nome" id="nome-Microondas">
    <input type="email" placeholder="Seu e-mail" id="email-Microondas">
    <button onclick="Presentear('Microondas')">Presentear</button>
  </div>
  <div class="card" id="Cooktop">
    <img src="Imagens/cooktop.png" alt="Cooktop" loading="lazy">
    <h3>Cooktop</h3>
    <input type="text" placeholder="Seu nome" id="nome-Cooktop">
    <input type="email" placeholder="Seu e-mail" id="email-Cooktop">
    <button onclick="Presentear('Cooktop')">Presentear</button>
  </div>
</div>
</div>

<script>
// Contagem regressiva
const countDownDate = new Date("Jun 20, 2026 18:00:00").getTime();
setInterval(() => {
  const now = new Date().getTime();
  const distance = countDownDate - now;
  const days = Math.floor(distance / (1000*60*60*24));
  const hours = Math.floor((distance % (1000*60*60*24))/(1000*60*60));
  const minutes = Math.floor((distance % (1000*60*60))/(1000*60));
  const seconds = Math.floor((distance % (1000*60))/1000);
  document.querySelectorAll("#countdown").forEach(d => d.innerHTML = `${days} dias ${hours}h ${minutes}m ${seconds}s`);
},1000);

// Maps
function abrirMapa(){
  const q = encodeURIComponent("Rua Vera Lucia, 215 - Sinimbu");
  window.open(`https://www.google.com/maps/search/?api=1&query=${q}`,"_blank","noopener");
}

// Pré-capa e música
const audio = document.getElementById("bgMusic");
const precover = document.getElementById("precover");
const mainContent = document.getElementById("mainContent");

function tocarMusica(){
  if(audio.paused){
    audio.play().catch(console.error);
  } else {
    audio.pause();
  }
}

function entrarEvento(){
  precover.style.display="none";
  mainContent.style.display="block";
  audio.volume=0;
  audio.play().then(() => {
    const start = Date.now();
    const fade = setInterval(() => {
      const elapsed = Date.now()-start;
      audio.volume = Math.min(0.3,(elapsed/4000)*0.3);
      if (elapsed>=4000) clearInterval(fade);
    },50);
  }).catch(console.error);
}

function voltarPreCapa(){
  mainContent.style.display="none";
  precover.style.display="flex";
}
</script>

<!-- Firebase + Firestore -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBv1JPd9CIzGsdEAEozbns7O87ct11dbIw",
  authDomain: "casamento-luiza-andre.firebaseapp.com",
  projectId: "casamento-luiza-andre",
  storageBucket: "casamento-luiza-andre.firebasestorage.app",
  messagingSenderId: "79078651574",
  appId: "1:79078651574:web:71d4b92e7ed41de2c49817"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const ITENS = ["Geladeira","Cooktop"];

function aplicarReservado(item, data){
  const card  = document.getElementById(item);
  if (!card) return;
  const botao = card.querySelector("button");
  card.querySelectorAll("input").forEach(i => i.style.display="none");
  if (botao){
    botao.disabled = true;
    botao.innerText = "Indisponível";
  }
}

function aplicarDisponivel(item){
  const card  = document.getElementById(item);
  if (!card) return;
  const botao = card.querySelector("button");
  card.querySelectorAll("input").forEach(i => i.style.display = "");
  if (botao){
    botao.disabled = false;
    botao.innerText = "Presentear";
  }
}

function iniciarListeners(){
  ITENS.forEach(item => {
    const ref = doc(db, "reservas", item);
    onSnapshot(ref, (snap) => {
      const data = snap.data();
      if (snap.exists() && data?.reservado === true){
        aplicarReservado(item, data);
      } else {
        aplicarDisponivel(item);
      }
    });
  });
}
iniciarListeners();

async function PresentearItem(item, nome, email){
  const ref = doc(db, "reservas", item);
  await runTransaction(db, async (transaction) => {
    const snap = await transaction.get(ref);
    if (snap.exists() && snap.data()?.reservado === true) {
      throw new Error("ja_reservado");
    }
    transaction.set(ref, {reservado: true,nome,email,ts: serverTimestamp()});
  });
}

window.Presentear = async function(item){
  const nomeEl  = document.getElementById("nome-"+item);
  const emailEl = document.getElementById("email-"+item);
  const card    = document.getElementById(item);
  const botao   = card?.querySelector("button");

  const nome  = (nomeEl?.value || "").trim();
  const email = (emailEl?.value || "").trim();

  if (!nome || !email){alert("Preencha nome e e-mail");return;}
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert("E-mail inválido");return;}
  if (botao?.disabled) return;

  const oldText = botao.innerText;
  botao.disabled = true;
  botao.innerText = "Reservando...";

  try {
    await PresentearItem(item, nome, email);
    aplicarReservado(item, {nome, email});
    try {
      await emailjs.send("service_7b5jpat","template_kl4avko",{nome,email,item,mensagem:"Obrigado por participar deste momento, estamos muito felizes por tudo."});
      alert("Reserva realizada com sucesso! ✨");
    } catch(e){
      console.error("Falha ao enviar e-mail:", e);
      alert("Reserva efetuada, mas houve um erro ao enviar o e-mail de confirmação.");
    }
  } catch (err) {
    if (err?.message === "ja_reservado") {
      alert("Ops! Este item já foi reservado.");
      aplicarReservado(item);
    } else {
      console.error(err);
      alert("Erro ao registrar a reserva. Tente novamente.");
      if (botao){botao.disabled=false;botao.innerText=oldText||"Presentear";}
    }
  }
};
</script>

</body>
